<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2701 Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>CS2701 Registration</h1>
<p>Register your GitHub username for CS2701</p>
</header>

<div class="container">
<h2>Student Details</h2>

<div id="success" class="success">
<p>Registration successful! Your details have been submitted.</p>
<a href="index.html">Register another student</a>
</div>

<form action="#success">
<label for="name">Full Name</label>
<input type="text" id="name" name="name" placeholder="Enter your name" required>

<label for="studentid">Student ID</label>
<input type="text" id="studentid" name="studentid" placeholder="Enter your student ID" required>

<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="Enter your uni email" required>

<label for="github">GitHub Username</label>
<input type="text" id="github" name="github" placeholder="Enter your GitHub username" required>

<label for="year">Year</label>
<select id="year" name="year">
<option>Year 1</option>
<option>Year 2</option>
<option>Year 3</option>
</select>

<button type="submit">Register</button>
</form>
</div>

<footer>
<p>CS2701 Lab - 2026</p>
</footer>

</body>
</html>
